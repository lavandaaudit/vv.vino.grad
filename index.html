<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBONIRIUM · BALCONY VV13. vino.grad · EXP-06</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-green: #39ff14;
            --bg-deep: #000205;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            inset: 0;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 5, 10, 0.9);
            border-left: 3px solid var(--neon-blue);
            padding: 15px;
            border-radius: 2px;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        .data-row {
            font-size: 10px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            gap: 40px;
        }

        .data-row span {
            color: var(--neon-blue);
            font-weight: bold;
        }

        .label {
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        #alert-box {
            margin-top: 10px;
            padding: 6px;
            font-size: 9px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-align: center;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: var(--neon-green);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }

        #overlay {
            position: absolute;
            bottom: 80px;
            right: 20px;
            text-align: right;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <canvas id="bgCanvas"></canvas>
    <canvas id="mainCanvas"></canvas>

    <div id="hud">
        <h1>Celestial Arch V6</h1>
        <div class="data-row"><span class="label">Wind Speed</span> <span id="wind">---</span></div>
        <div class="data-row"><span class="label">Kp Index</span> <span id="storm">---</span></div>
        <div class="data-row"><span class="label">Proton Flux</span> <span id="proton">---</span></div>
        <div class="data-row"><span class="label">Electron Flux</span> <span id="electron">---</span></div>
        <div class="data-row"><span class="label">Season</span> <span id="season">---</span></div>
        <div id="alert-box">ANALYSIS: STABLE</div>
    </div>

    <div id="overlay">IBONIRIUM · BALCONY PERSPECTIVE<br>CELESTIAL GRAPEVINE ARCH</div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const bgCanvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const bctx = bgCanvas.getContext('2d');

        let width, height;
        let ssn = 0, protonFlux = 0, kpIndex = 0, solarWind = 400, electronFlux = 0;
        let recentFlare = { class: 'None' };
        let alertMode = 'STABLE';
        let stormLevel = 0.1, radiationLevel = 0.1;

        function resize() {
            width = canvas.width = bgCanvas.width = window.innerWidth;
            height = canvas.height = bgCanvas.height = window.innerHeight;
            drawStaticBackground();
        }
        window.addEventListener('resize', resize);

        async function fetchNOAA() {
            try {
                const [rSSN, rProton, rFlare, rKp, rWind, rElectron] = await Promise.all([
                    fetch('https://services.swpc.noaa.gov/json/solar-cycle/predicted-solar-cycle.json').then(r => r.json()).catch(() => null),
                    fetch('https://services.swpc.noaa.gov/json/goes/primary/integral-protons-plot-6-hour.json').then(r => r.json()).catch(() => null),
                    fetch('https://services.swpc.noaa.gov/json/goes/primary/xray-flares-7-day.json').then(r => r.json()).catch(() => null),
                    fetch('https://services.swpc.noaa.gov/json/planetary_k_index_1m.json').then(r => r.json()).catch(() => null),
                    fetch('https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json').then(r => r.json()).catch(() => null),
                    fetch('https://services.swpc.noaa.gov/json/goes/primary/integral-electrons-plot-6-hour.json').then(r => r.json()).catch(() => null)
                ]);

                if (rSSN) ssn = rSSN[rSSN.length - 1]?.predicted_ssn || 15;
                if (rProton) protonFlux = parseFloat(rProton[rProton.length - 1]?.flux) || 1;
                if (rKp) kpIndex = parseFloat(rKp[rKp.length - 1]?.kp_index) || 0;
                if (rWind && rWind.length > 0) solarWind = parseFloat(rWind[rWind.length - 1].wind_speed) || 400;
                if (rElectron) electronFlux = parseFloat(rElectron[rElectron.length - 1]?.flux) || 100;
                if (rFlare && rFlare.length > 0) recentFlare = { class: rFlare[rFlare.length - 1]?.current_class || 'None' };

                stormLevel = Math.min(1, kpIndex / 9);
                radiationLevel = Math.min(1, Math.log10(protonFlux + 1) / 4);

                const abox = document.getElementById('alert-box');
                if (kpIndex >= 6 || radiationLevel > 0.6 || recentFlare.class.startsWith('X')) {
                    alertMode = 'CRITICAL';
                    abox.style.background = '#f04';
                } else if (kpIndex >= 4 || radiationLevel > 0.4 || recentFlare.class.startsWith('M')) {
                    alertMode = 'WARNING';
                    abox.style.background = '#f80';
                } else {
                    alertMode = 'STABLE';
                    abox.style.background = 'rgba(255,255,255,0.05)';
                }

                abox.textContent = `ANALYSIS: ${alertMode}`;
                document.getElementById('wind').textContent = solarWind.toFixed(0) + ' km/s';
                document.getElementById('storm').textContent = kpIndex.toFixed(1);
                document.getElementById('proton').textContent = protonFlux.toFixed(2);
                document.getElementById('electron').textContent = electronFlux.toFixed(0);
                drawStaticBackground(); // Redraw with stars
            } catch (e) { console.warn("NOAA Sync Error"); }
        }
        setInterval(fetchNOAA, 60000); fetchNOAA();

        function getSeason() {
            const m = new Date().getMonth();
            if (m >= 2 && m <= 4) return { name: 'Spring', hue: 120, vitality: 1.0, fruit: 0.1 };
            if (m >= 5 && m <= 7) return { name: 'Summer', hue: 160, vitality: 1.5, fruit: 0.7 };
            if (m >= 8 && m <= 10) return { name: 'Autumn', hue: 40, vitality: 0.8, fruit: 1.0 };
            return { name: 'Winter', hue: 200, vitality: 0.4, fruit: 0 };
        }

        function drawStaticBackground() {
            // Space Center
            bctx.fillStyle = '#000205';
            bctx.fillRect(0, 0, width, height);

            // Stars
            bctx.fillStyle = '#fff';
            for (let i = 0; i < 200; i++) {
                const sX = Math.random() * width;
                const sY = Math.random() * height;
                const sS = Math.random() * 1.5;
                bctx.globalAlpha = 0.2 + Math.random() * 0.5;
                bctx.beginPath();
                bctx.arc(sX, sY, sS, 0, Math.PI * 2);
                bctx.fill();
            }
            bctx.globalAlpha = 1.0;

            // Balcony Rails (Bottom)
            const railY = height - 60;
            bctx.fillStyle = '#0a0a0a';
            bctx.fillRect(0, railY, width, 60); // Main railing base

            bctx.strokeStyle = '#151515';
            bctx.lineWidth = 2;
            for (let i = 0; i < width; i += 40) {
                bctx.strokeRect(i, railY, 40, 60); // Rail posts
            }
            bctx.fillStyle = '#111';
            bctx.fillRect(0, railY, width, 10); // Handrail top
        }

        class GeometricLeaf {
            constructor(x, y, angle, size) {
                this.x = x; this.y = y; this.angle = angle; this.size = size;
                this.phase = Math.random() * Math.PI * 2;
            }
            draw(ctx, color) {
                const time = Date.now() * 0.001;
                const sway = Math.sin(time + this.phase) * (solarWind / 2500);
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle + sway);

                if (alertMode === 'CRITICAL' && Math.random() < 0.1) {
                    ctx.translate((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15);
                    ctx.strokeStyle = '#fff';
                } else {
                    ctx.strokeStyle = color;
                }

                ctx.lineWidth = 1;
                ctx.beginPath();
                // Geometric Polygon Leaf
                for (let i = 0; i < 5; i++) {
                    const ang = (i / 5) * Math.PI * 2;
                    const r = (i % 2 === 0) ? this.size : this.size * 0.5;
                    ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }
        }

        class GeometricGrape {
            constructor(x, y, count) {
                this.x = x; this.y = y;
                this.berries = Array.from({ length: count }, () => ({
                    ox: (Math.random() - 0.5) * 35,
                    oy: Math.random() * 50,
                    r: 3 + Math.random() * 5,
                    spark: Math.random() * Math.PI * 2
                }));
            }
            draw(ctx, color, fruitScale) {
                if (fruitScale <= 0) return;
                const time = Date.now() * 0.001;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(time * 0.5) * 0.1 * (solarWind / 1000));

                this.berries.forEach(b => {
                    const br = b.r * fruitScale;
                    const gx = b.ox * fruitScale;
                    const gy = b.oy * fruitScale;
                    ctx.strokeStyle = color;
                    ctx.beginPath();
                    ctx.arc(gx, gy, br, 0, Math.PI * 2);
                    ctx.stroke();

                    const res = Math.max(0, stormLevel * 0.6 + (electronFlux / 6000));
                    if (res > 0.1) {
                        ctx.strokeStyle = `hsla(180, 100%, 80%, ${Math.sin(time * 12 + b.spark) * res})`;
                        ctx.beginPath();
                        ctx.arc(gx, gy, br * 0.6, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        }

        class ArchVine {
            constructor(startX, startY, type) {
                this.nodes = [{ x: startX, y: startY, a: type === 'top' ? Math.PI / 2 : (startX < width / 2 ? 0 : Math.PI), l: 0 }];
                this.type = type; // 'top', 'left', 'right'
                this.maxNodes = 150 + Math.random() * 100;
                this.thickness = 1 + Math.random() * 2;
            }
            grow(season) {
                if (this.nodes.length >= this.maxNodes * season.vitality) return;

                const parent = this.nodes[Math.floor(Math.random() * this.nodes.length)];
                let angle = parent.a + (Math.random() - 0.5) * 1.2;

                // Gravity / Center influence logic for Arching
                if (this.type === 'top') angle += (Math.random() - 0.5) * 0.5; // Hang down
                else if (this.type === 'left') angle += (0.1 - (parent.x / width)) * 0.5; // Grow inward
                else if (this.type === 'right') angle += ((parent.x / width) - 0.9) * 0.5; // Grow inward

                const len = 10 + Math.random() * 15;
                const nx = parent.x + Math.cos(angle) * len;
                const ny = parent.y + Math.sin(angle) * len;

                // Stop if hitting balcony
                if (ny > height - 60) return;

                const newNode = { x: nx, y: ny, a: angle, l: len, leaf: null, cluster: null };
                if (Math.random() < 0.7 * season.vitality) {
                    newNode.leaf = new GeometricLeaf(nx, ny, angle + Math.PI / 2, 12 + Math.random() * 18);
                }
                if (Math.random() < 0.12 * season.fruit) {
                    newNode.cluster = new GeometricGrape(nx, ny, 8 + Math.floor(Math.random() * 12));
                }

                parent.child = newNode;
                this.nodes.push(newNode);
            }
            draw(ctx, season) {
                const time = Date.now() * 0.001;
                const windBend = (solarWind / 4500);

                let hue = season.hue;
                if (alertMode === 'CRITICAL') hue = (time * 60) % 360;

                ctx.lineWidth = this.thickness;
                this.nodes.forEach((node, i) => {
                    if (!node.child) return;
                    const shift = Math.sin(time + node.x * 0.01) * windBend * (node.y / height) * 40;
                    ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.7)`;
                    ctx.beginPath();
                    ctx.moveTo(node.x + shift, node.y);
                    ctx.lineTo(node.child.x + shift, node.child.y);
                    ctx.stroke();

                    if (node.leaf && season.name !== 'Winter') node.leaf.draw(ctx, `hsla(${hue + 40}, 100%, 60%, 0.5)`);
                    if (node.cluster) node.cluster.draw(ctx, `hsla(${hue + 180}, 100%, 70%, 0.8)`, season.fruit);
                });
            }
        }

        const systemVines = [];
        function initSystem() {
            systemVines.length = 0;
            // Top beam vines - Much more dense
            for (let i = 0; i < 25; i++) {
                systemVines.push(new ArchVine(width * (i / 24), -20, 'top'));
            }
            // Side vines - layering them for depth
            for (let i = 0; i < 15; i++) {
                systemVines.push(new ArchVine(-20, height * (i / 14), 'left'));
                systemVines.push(new ArchVine(width + 20, height * (i / 14), 'right'));
            }
        }

        function animate() {
            const season = getSeason();
            document.getElementById('season').textContent = season.name;
            ctx.fillStyle = 'rgba(0, 2, 5, 0.25)';
            ctx.fillRect(0, 0, width, height);

            systemVines.forEach(v => {
                // Faster growth for a 'wild' look
                for (let g = 0; g < 2; g++) v.grow(season);
                v.draw(ctx, season);
            });
            requestAnimationFrame(animate);
        }

        resize();
        initSystem();
        animate();
    </script>
</body>

</html>
